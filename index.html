<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Liberado ✅</title>
<meta name="description" content="Acesso liberado. Escolha o canal e entre agora mesmo.">

<!-- Acelera o redirecionamento: conexão antecipada com os destinos -->
<link rel="preconnect" href="https://t.me" crossorigin>
<link rel="preconnect" href="https://wa.me" crossorigin>
<link rel="dns-prefetch" href="https://t.me">
<link rel="dns-prefetch" href="https://wa.me">

<style>
  :root{
    --bg1:#ff5fa2;
    --bg2:#d0117a;
    --wa:#25d366;
    --wa-dark:#128c54;
    --tg:#2aabee;
    --tg-dark:#1c7fbd;
    --accent:#ff4f9a;
    --accent-dark:#d81b7a;
    --text:#fff;
    --muted:#ffe3f1;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}

  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:radial-gradient(1200px 600px at 20% -10%,#ff86bd 0%,transparent 60%),
               radial-gradient(1000px 700px at 100% 0%,#ff9ecb 0%,transparent 55%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  /* leves partículas de fundo */
  .glow{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.3;
    z-index:0;
    animation:float 9s ease-in-out infinite;
  }
  .glow.g1{width:280px;height:280px;background:#ffffff;top:-60px;left:-40px;}
  .glow.g2{width:240px;height:240px;background:#ff9ec7;bottom:-60px;right:-30px;animation-delay:-4s;}

  @keyframes float{
    0%,100%{transform:translateY(0) translateX(0);}
    50%{transform:translateY(-28px) translateX(14px);}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    background:rgba(255,255,255,0.10);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:26px;
    padding:44px 30px 40px;
    text-align:center;
    box-shadow:0 30px 80px rgba(150,10,80,0.45);
    animation:pop .6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes pop{
    from{opacity:0;transform:translateY(24px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  .avatar{
    width:96px;height:96px;
    margin:0 auto 22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;
    background:linear-gradient(145deg,var(--accent),var(--accent-dark));
    box-shadow:0 12px 30px rgba(216,27,122,0.55);
    animation:pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{box-shadow:0 12px 30px rgba(216,27,122,0.55);}
    50%{box-shadow:0 12px 46px rgba(216,27,122,0.85);}
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    color:#c8ffd9;
    background:rgba(37,211,102,0.16);
    border:1px solid rgba(37,211,102,0.4);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:26px;
  }
  .badge .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--wa);
    box-shadow:0 0 0 0 rgba(37,211,102,.7);
    animation:blink 1.4s infinite;
  }
  @keyframes blink{
    0%{box-shadow:0 0 0 0 rgba(37,211,102,.7);}
    70%{box-shadow:0 0 0 8px rgba(37,211,102,0);}
    100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
  }

  .btns{display:flex;flex-direction:column;gap:14px;}

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:17px 20px;
    border:none;
    border-radius:16px;
    font-size:16.5px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    text-decoration:none;
    letter-spacing:.2px;
    overflow:hidden;
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn svg{width:24px;height:24px;flex:none;}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
  .btn:active{transform:translateY(0) scale(.98);}

  .btn.wa{
    background:linear-gradient(135deg,var(--wa),var(--wa-dark));
    box-shadow:0 12px 26px rgba(37,211,102,0.4);
  }
  .btn.tg{
    background:linear-gradient(135deg,var(--tg),var(--tg-dark));
    box-shadow:0 12px 26px rgba(42,171,238,0.4);
  }

  /* brilho deslizante */
  .btn::after{
    content:"";
    position:absolute;
    top:0;left:-120%;
    width:60%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-20deg);
    animation:shine 3.2s infinite;
  }
  @keyframes shine{
    0%{left:-120%;}
    55%{left:140%;}
    100%{left:140%;}
  }

  @media(max-width:400px){
    .card{padding:36px 22px 32px;}
  }
</style>
</head>
<body>

  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <main class="card">
    <div class="avatar">🎁</div>

    <div class="badge"><span class="dot"></span> Acesso liberado agora</div>

    <div class="btns">
      <a class="btn tg" id="btn-telegram" href="https://t.me/aurorasslv" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M9.78 15.6l-.4 4.1c.57 0 .82-.24 1.12-.53l2.7-2.56 5.6 4.09c1.02.56 1.75.27 2.02-.94l3.66-17.1.01-.01c.32-1.5-.55-2.09-1.55-1.72L2.2 9.36c-1.47.57-1.45 1.39-.25 1.76l5.42 1.69L18.66 5.7c.59-.38 1.13-.17.69.21z"/>
        </svg>
        Entrar pelo Telegram
      </a>

      <a class="btn wa" id="btn-whatsapp" href="https://wa.me/message/B4QRNBOIVWDHG1" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.5 14.4c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49 0 1.47 1.07 2.89 1.22 3.09.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35z"/>
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0012.04 2zm0 18.1h-.01c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.11.82.83-3.04-.2-.32a8.19 8.19 0 01-1.26-4.38c0-4.53 3.69-8.22 8.24-8.22 2.2 0 4.27.86 5.82 2.42a8.16 8.16 0 012.41 5.81c0 4.54-3.69 8.23-8.23 8.23z"/>
        </svg>
        Entrar pelo WhatsApp
      </a>
    </div>
  </main>

<script>
  // Redirecionamento extremamente fluido, sem delays.
  // Os links já são nativos (<a href>), mas garantimos o disparo imediato
  // e feedback visual instantâneo ao toque, sem bloquear a navegação.
  (function () {
    var links = document.querySelectorAll('.btn');

    links.forEach(function (link) {
      // Pré-aquece a conexão ao passar o mouse / iniciar o toque = redirect mais rápido
      var warmed = false;
      function warm() {
        if (warmed) return;
        warmed = true;
        try {
          var hint = document.createElement('link');
          hint.rel = 'preconnect';
          hint.href = new URL(link.href).origin;
          hint.crossOrigin = '';
          document.head.appendChild(hint);
        } catch (e) {}
      }
      link.addEventListener('mouseenter', warm, { passive: true });
      link.addEventListener('touchstart', warm, { passive: true });
    });
  })();
</script>
</body>
</html>
